name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  docs-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig fmt check
        shell: bash
        run: |
          files=$(find . -type f -name '*.zig' \
            -not -path './.zig-cache/*' \
            -not -path './zig-out/*' \
            -not -path './bench/parsers/*' \
            -not -path './bench/build/*')
          zig fmt --check $files

      - name: Build artifacts
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: Benchmark smoke
        shell: bash
        run: |
          zig build bench-only -Doptimize=ReleaseFast
          for mode in validated validated-trusted permissive; do
            ./zig-out/bin/zxml-bench parse "$mode" bench/smoke.xml 1 >/dev/null
            ./zig-out/bin/zxml-stream-bench parse "$mode" bench/smoke.xml 1 >/dev/null
          done

      - name: Darwin compile and 32-bit public API
        shell: bash
        run: |
          zig build bench-only -Dtarget=x86_64-macos -Doptimize=ReleaseFast
          zig build test-public-api -Dtarget=x86-linux-musl -Dintlen=u64 -Doptimize=ReleaseSafe

      - name: Conformance
        run: zig build conformance
